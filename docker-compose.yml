version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oas_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: orchestre_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    # pgadmin pour voir la bdd
    image: dpage/pgadmin4
    container_name: oas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orchestre.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data:
